[package]
name = "dr2-dualsense"
version = "0.2.0"
edition = "2021"
description = "DualSense adaptive triggers and haptics mod for DiRT Rally 2.0"
license = "MIT"

[lib]
name = "xinput9_1_0"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "dr2ds-harness"
path = "src/bin/harness.rs"

[[bin]]
name = "dr2ds-sim"
path = "src/bin/sim.rs"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_Security",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
